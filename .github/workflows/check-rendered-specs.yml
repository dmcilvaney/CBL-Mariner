name: Check Rendered Specs

on:
  pull_request:
    branches:
      - tomls/base/main
    paths:
      - "base/comps/**"
      - "distro/**"
      - "specs/**"

permissions: {}

concurrency:
  group: render-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Rendered specs freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "stable"

      - name: Install azldev
        #run: go install github.com/microsoft/azure-linux-dev-tools/azldev@main
        run: go install github.com/dmcilvaney/azure-linux-dev-tools/cmd/azldev@damcilva/rendered-spec-output-mock-v2-parts/4_add_render_cmd

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Render all specs
        run: azldev comp render -a

      - name: Check for drift
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/workflows/scripts/check_rendered_specs.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --report render-check-report.json
